<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Farshestan</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <link rel="stylesheet" href="homepage.css">
  <script src="[cdnjs.cloudflare.com](https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js)"></script>
  <script src="[cdnjs.cloudflare.com](https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.dom.min.js)"></script>
  <script type="module" src="[unpkg.com](https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js)"></script>
  <link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic&display=swap)" rel="stylesheet">

  <style>
    #overlayText {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      z-index: 100;
      text-align: center;
      font-family: 'Vazirmatn';
      padding: 12px 20px;
      background-color: transparent;
      transition: opacity 0.3s ease;
    }

    .overlayMainText {
      font-size: 50px;
      line-height: 1.1;
      max-width: 800px;
      margin: 0 auto;
      font-family: 'Noto Naskh Arabic';
    }

    .overlaySubText {
      font-size: 25px;
      line-height: 1.2;
      margin-top: 8px;
      letter-spacing: 1px;
    }

    #overlayText:hover,
    model-viewer:active + #overlayText {
      opacity: 0;
      pointer-events: none;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateX(-50%) translateY(0);
      }
      50% {
        transform: translateX(-50%) translateY(-10px);
      }
    }
  </style>
</head>
<body>

  <model-viewer 
    src="assets/model/scene.gltf"
    alt="Farshestan 3D Model"
    camera-controls
    exposure="0.9"
    shadow-intensity="1"
    environment-image="neutral"
    field-of-view="100deg"
    camera-orbit="-90deg 90deg 3.9m"
    min-camera-orbit="auto 89deg 3m"
    max-camera-orbit="auto 91deg 4.2m"
    min-field-of-view="25deg"
    max-field-of-view="75deg"
    style="margin:0; padding:0; position:fixed; top:0; left:0; width:100%; height:100%; background-color:transparent; filter:brightness(0.8) saturate(1.4) contrast(1.05);"
  ></model-viewer>

  <div id="overlayText">
    <div class="overlayMainText">Home of traditional Persian carpets.</div>
    <div class="overlaySubText">Handcrafted in Iran.</div>
  </div>

  <script src="homepage.js"></script>
  <script src="menu.js"></script>
  <script src="cart.js"></script>

  <script>
    const viewer = document.querySelector('model-viewer');

    viewer.addEventListener('camera-change', () => {
      const orbit = viewer.getCameraOrbit();
      const thetaDeg = orbit.theta * (180 / Math.PI);
      const phiDeg = orbit.phi * (180 / Math.PI);
      const radius = orbit.radius;

      // If camera turned to the front (around 0deg)
      if (thetaDeg > -45 && thetaDeg < 45 && radius > 4) {
        viewer.cameraOrbit = `${thetaDeg}deg ${phiDeg}deg 1m`;
      }

      // If camera turned to the back (around 180deg or -180deg)
      if ((thetaDeg > 135 || thetaDeg < -135) && radius > 6) {
        viewer.cameraOrbit = `${thetaDeg}deg ${phiDeg}deg 1m`;
      }
    });
  </script>

</body>
</html>
