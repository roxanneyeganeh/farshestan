<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Farshestan</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="homepage.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body class="home">

  <!-- Slide-up panel (Info) -->
  <div id="slidePanel">
    <iframe id="panelContent" src="" title="Information"></iframe>
  </div>


  <!-- 3D scene -->
  <model-viewer
    src="assets/model/scene.gltf"
    alt="Farshestan 3D Model"
    camera-controls
    auto-rotate
    exposure="0.9"
    shadow-intensity="1"
    environment-image="neutral"
    field-of-view="100deg"
    camera-orbit="-90deg 90deg 3.9m"
    min-camera-orbit="auto 89deg 3m"
    max-camera-orbit="auto 91deg 4.2m"
    auto-rotate-delay="3000"
    auto-rotate-speed="20"
    min-field-of-view="25deg"
    max-field-of-view="75deg"
  ></model-viewer>

  <div class="home-vignette" aria-hidden="true"></div>


  <!-- Overlay text (fades while you drag the scene) -->
  <div id="overlayText">
    <span class="overlayEyebrow">Est. 1998</span>
    <div class="overlayMainText">Home of traditional Persian carpets.</div>
    <div class="overlaySubText">Handcrafted in Iran</div>
  </div>

  <a class="home-cta" href="/shop">Explore the collection</a>


  <script src="homepage.js"></script>
  <script src="cart.js"></script>
  <script src="menu.js"></script>

  <script>
    const viewer = document.querySelector('model-viewer');
    const overlay = document.getElementById('overlayText');

    viewer.addEventListener('camera-change', () => {
      const orbit = viewer.getCameraOrbit();

      // If camera turned to the front (around 0°)
      if (orbit.theta > -45 && orbit.theta < 45 && orbit.radius > 4)
        viewer.cameraOrbit = `${orbit.theta}deg ${orbit.phi}deg 1m`;

      // If camera turned to the back (around 180° or -180°)
      if ((orbit.theta > 135 || orbit.theta < -135) && orbit.radius > 6)
        viewer.cameraOrbit = `${orbit.theta}deg ${orbit.phi}deg 1m`;
    });

    // Hide the headline while the visitor is dragging the scene
    viewer.addEventListener('pointerdown', () => overlay.classList.add('is-hidden'));
    window.addEventListener('pointerup', () => overlay.classList.remove('is-hidden'));
  </script>

</body>
</html>
