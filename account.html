<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="site.css" />
  <link rel="stylesheet" href="account.css" />
  <link rel="stylesheet" href="corners.css" />
</head>
<body>

  <!-- Slide-up panel (Info) -->
  <div id="slidePanel">
    <iframe id="panelContent" src="" title="Information"></iframe>
  </div>


  <main class="account-layout">

    <figure class="account-visual">
      <img src="assets/weaving1.jpg" alt="Hands weaving a Persian rug on a loom">
      <figcaption>Handwoven in Iran since 1998.</figcaption>
    </figure>


    <section class="login-container">

      <p class="account-fa fa" lang="fa" aria-hidden="true">حساب کاربری</p>
      <h3>Welcome back</h3>
      <p class="lede">Sign in to view your orders and saved rugs.</p>

      <form>
        <div class="field">
          <label for="username">Username</label>
          <input class="input" type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input class="input" type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required />
        </div>

        <div class="form-meta">
          <a href="#" class="text-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-block">Login</button>
      </form>

      <p class="divider">New to Farshestan?</p>

      <button type="button" class="create-account-btn btn btn-outline btn-block">Create an account</button>

    </section>

  </main>


  <script src="account.js"></script>
  <script src="cart.js"></script>
  <script src="menu.js"></script>

</body>
</html>
