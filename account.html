<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>account</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <link rel="stylesheet" href="account.css" />


  </style>
</head>
<body>


  <!-- 🔳 Slide-Up Panel -->
  <div id="slidePanel">
    <iframe id="panelContent" src=""></iframe>
  </div>


  <div class="login-container">
    <h3>Login</h3>
    <form>
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter username" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" required />

      <button type="submit">Login</button>
    </form>
    <button class="create-account-btn">Create an account</button>
  </div>

  <script src="account.js"></script>
  <script src="menu.js"></script>
    <script src="cart.js"></script>


      <script>
    document.getElementById("openPanelLink").addEventListener("click", function(event) {
      event.preventDefault();
      const panel = document.getElementById("slidePanel");
      const iframe = document.getElementById("panelContent");
      panel.style.bottom = "0";
      iframe.src = "other-page.html"; // Replace with your actual URL
    });
  </script>

</body>
</html>
