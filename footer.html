<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Footer</title>

  <!-- Footer lives in an iframe: open every link in the main window -->
  <base target="_top">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

  <style>
    @font-face {
      font-family: 'Vazirmatn';
      src: url('assets/Vazirmatn.ttf') format('truetype');
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f7f2eb;
      color: #000;
      font-family: 'Vazirmatn', sans-serif;
      line-height: 1.3;
      -webkit-font-smoothing: antialiased;
    }

    .footer {
      padding: 4rem 3rem 2rem;
      border-top: 1px solid #000;
    }

    .footer-row {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr 1fr;
      gap: 3rem;
    }

    .footer-col h4 {
      margin-bottom: 1rem;
      font-size: 0.75rem;
      font-weight: normal;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .footer-col ul {
      list-style: none;
    }

    .footer-col li {
      margin-bottom: 0.5rem;
    }

    .footer a {
      color: #000;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .footer a:hover {
      color: #A52A2A;
    }

    .footer-col p,
    .footer-col li {
      font-size: 1rem;
    }

    .subscribe-text {
      margin-bottom: 1rem;
      color: #555;
      max-width: 34ch;
      line-height: 1.45;
    }

    .subscribe-form {
      display: flex;
      max-width: 380px;
    }

    .subscribe-form input[type="email"] {
      flex: 1;
      min-width: 0;
      padding: 0.75rem 1rem;
      border: 1px solid #000;
      border-radius: 0;
      background: #f7f2eb;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
    }

    .subscribe-form input[type="email"]:focus {
      background: #fff;
    }

    .subscribe-form button {
      padding: 0.75rem 1.25rem;
      border: 1px solid #000;
      border-left: none;
      border-radius: 0;
      background: #f7f2eb;
      color: #000;
      font-family: inherit;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .subscribe-form button:hover {
      background: #000;
      color: #f7f2eb;
    }

    .subscribe-thanks {
      margin-top: 0.75rem;
      font-size: 0.9rem;
      color: #555;
    }

    .socials {
      display: flex;
      gap: 0.75rem;
    }

    .socials li {
      margin: 0;
    }

    .socials a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid #000;
      border-radius: 50%;
      font-size: 0.95rem;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .socials a:hover {
      background: #000;
      color: #f7f2eb;
    }

    .footer-wordmark {
      margin-top: 4rem;
      font-family: 'Noto Naskh Arabic', serif;
      font-weight: 600;
      font-size: clamp(3rem, 12vw, 10rem);
      line-height: 1;
      letter-spacing: -0.01em;
    }

    .footer-bottom {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(0, 0, 0, 0.12);
      font-size: 0.8rem;
      color: #555;
    }

    @media (max-width: 900px) {
      .footer-row {
        grid-template-columns: 1fr 1fr;
      }

      .footer-col.subscribe {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 600px) {
      .footer {
        padding: 3rem 1rem 1.5rem;
      }

      .footer-row {
        grid-template-columns: 1fr;
        gap: 2rem;
      }

      .footer-bottom {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <footer class="footer">

    <div class="footer-row">

      <div class="footer-col subscribe">
        <h4>Subscribe</h4>
        <p class="subscribe-text">Get the latest inspiration from the world of Persian rugs.</p>
        <form class="subscribe-form" action="#" method="post">
          <input type="email" name="email" placeholder="Your email address" aria-label="Email address" required />
          <button type="submit">Sign Up</button>
        </form>
        <p class="subscribe-thanks" hidden>Thank you for subscribing.</p>
      </div>

      <div class="footer-col">
        <h4>Info</h4>
        <ul>
          <li><a href="/info">About Us</a></li>
          <li><a href="/shop">Shop All Rugs</a></li>
          <li><a href="/account">Account</a></li>
        </ul>
      </div>

      <div class="footer-col">
        <h4>Get In Touch</h4>
        <ul>
          <li><a href="mailto:contact@farshestan.online">contact@farshestan.online</a></li>
        </ul>
      </div>

      <div class="footer-col">
        <h4>Follow Us</h4>
        <ul class="socials">
          <li><a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a></li>
          <li><a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a></li>
          <li><a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a></li>
          <li><a href="#" aria-label="X"><i class="fab fa-x-twitter"></i></a></li>
        </ul>
      </div>

    </div>

    <div class="footer-wordmark">Farshestan</div>

    <div class="footer-bottom">
      <p>&copy; <span id="year">2026</span> Farshestan. All rights reserved.</p>
      <p>Handwoven in Iran.</p>
    </div>

  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const form = document.querySelector('.subscribe-form');
    form.addEventListener('submit', e => {
      e.preventDefault();
      form.hidden = true;
      document.querySelector('.subscribe-thanks').hidden = false;
    });
  </script>

</body>
</html>
