<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Responsive Footer</title>
  <style>
    @font-face {
      font-family: 'Vazirmatn';
      src: url('assets/Vazirmatn.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Vazirmatn';
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
    }

    .footer {
      background-color: #ffffff;
      color: #000000;
      padding: 30px 50px 20px;
      font-size: 0.85rem;
      border-top: 1px solid #000000;
    }

    .footer-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      gap: 25px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .footer-col {
      flex: 1 1 200px;
      min-width: 140px;
    }

    .footer-col h4 {
      font-size: 0.9rem;
      margin-bottom: 8px;
      font-weight: normal;
      text-decoration: underline;
    }

    .footer-col ul {
      list-style: none;
    }

    .footer-col ul li {
      margin-bottom: 6px;
    }

    .footer-col ul li a {
      color: #000000;
      text-decoration: none;
      transition: color 0.3s;
    }

    .footer-col ul li a:hover {
      color: #A52A2A;
    }

    .contact-email {
      font-size: 0.9rem;
    }

    .contact-email a {
      color: #000000;
      text-decoration: none;
      transition: color 0.3s;
    }

    .contact-email a:hover {
      color: #A52A2A;
    }

    .socials {
      display: flex;
      gap: 15px;
      padding: 0;
    }

    .socials li {
      list-style: none;
    }

    .socials a {
      color: #000000;
      font-size: 1.2rem;
      transition: color 0.3s;
    }

    .socials a:hover {
      color: #A52A2A;
    }

    .subscribe-form {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .subscribe-form input[type="email"],
    .subscribe-form button {
      padding: 7px 10px;
      font-size: 0.9rem;
      width: 100%;
      max-width: 250px;
      border-radius: 3px;
      border: 1px solid black;
    }

    .subscribe-form button {
      background-color: #ffffff;
      color: #111;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .footer-bottom {
      text-align: center;
      margin-top: 40px;
      font-size: 0.75rem;
    }
  </style>

  <!-- Font Awesome CDN for icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
  />
</head>
<body>


  <footer class="footer">
    <div class="footer-row">
      <div class="footer-col">
        <h4>Info</h4>
        <ul>
          <li><a href="#">About Us</a></li>
        </ul>
      </div>

      <div class="footer-col">
        <h4>Get In Touch</h4>
        <div class="contact-email">
          <a href="mailto:contact@farshestan.online">contact@farshestan.online</a>
        </div>
      </div>

      <div class="footer-col">
        <h4>Subscribe</h4>
        <form class="subscribe-form" action="#" method="post">
          <input type="email" name="email" placeholder="Your email address" required />
          <button type="submit">Subscribe</button>
        </form>
      </div>

      <div class="footer-col">
        <h4>Follow Us</h4>
        <ul class="socials">
          <li><a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a></li>
          <li><a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a></li>
          <li><a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a></li>
          <li><a href="#" aria-label="X"><i class="fab fa-x-twitter"></i></a></li>
        </ul>
      </div>
    </div>

    <div class="footer-bottom">
      <p>&copy; 2025 Farshestan. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
